# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: kyle's notes
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: pink10000.github.io/notes
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Space Grotesk
      body: Source Sans Pro
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#ed74c3"
        tertiary: "#5a6ded"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#f2b6de"
        tertiary: "#89bdf4"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
      katexOptions:
        trust: true
      customMacros:
        \R: \mathbb{R}
        \N: \mathbb{N}
        \Z: \mathbb{Z}
        \C: \mathbb{C}
        \Q: \mathbb{Q}
        \RQ: \R\backslash\Q
        \cA: \mathcal{A}
        \sR: \mathscr{R}
        \var: \text{Var}
        \Binom: \text{Binom}
        \bias: \text{Bias}
        \pois: \text{Pois}
        \Exp: \text{Exp}
        \P: \mathbb{P}
        \Cov: \text{Cov}
        \E: \mathbb{E}\left[#1\right]
        \trace: \text{trace}
        \ker: \text{Ker }
        \kerphi: \text{Ker }\varphi
        \id: \text{Id}
        \GL: \text{GL}
        \SL: \text{SL}
        \Re: \text{Re}
        \Im: \text{Im}
        \diam: \text{diam}
        \vepsi: \varepsilon
        \ovl: \overline{#1}
        \unl: \underline{#1}
        \Cl: \text{Cl}
        \xcancel: \cancel{\bcancel{#1}}
        \del: \partial
        \oiint: \subset\!\supset} \mathllap{\iint}}
        \notexists: \nexists
        \vvf: \textbf{f}
        \rrarrow: \rightrightarrows
        \ceil: "\\left\\lceil #1 \\right\\rceil"
        \llbracket: "[\\!["
        \rrbracket: "]\\!]"
        \argmax: \operatorname*{argmax}
        \argmin: \operatorname*{argmin}
        \dimM: \mathsf{M}
        \dimL: \mathsf{L}
        \dimT: \mathsf{T}
        \dimTheta: \mathsf{\Theta}
        \dimI: \mathsf{I}
        \dimC: \mathsf{C}
        \dimN: \mathsf{N}
        \dimB: \mathsf{B}
        \bzero: \mathbf{0}
        \SE: \operatorname{SE}
        \SO: \operatorname{SO}
        \ba: \mathbf{a}
        \bb: \mathbf{b}
        \bc: \mathbf{c}
        \bd: \mathbf{d}
        \be: \mathbf{e}
        \bf: \mathbf{f}
        \bg: \mathbf{g}
        \bh: \mathbf{h}
        \bi: \mathbf{i}
        \bj: \mathbf{j}
        \bk: \mathbf{k}
        \bl: \mathbf{l}
        \bm: \mathbf{m}
        \bn: \mathbf{n}
        \bo: \mathbf{o}
        \bp: \mathbf{p}
        \bq: \mathbf{q}
        \br: \mathbf{r}
        \bs: \mathbf{s}
        \bt: \mathbf{t}
        \bu: \mathbf{u}
        \bv: \mathbf{v}
        \bw: \mathbf{w}
        \bx: \mathbf{x}
        \by: \mathbf{y}
        \bz: \mathbf{z}
        \bA: \mathbf{A}
        \bB: \mathbf{B}
        \bC: \mathbf{C}
        \bD: \mathbf{D}
        \bE: \mathbf{E}
        \bF: \mathbf{F}
        \bG: \mathbf{G}
        \bH: \mathbf{H}
        \bI: \mathbf{I}
        \bJ: \mathbf{J}
        \bK: \mathbf{K}
        \bL: \mathbf{L}
        \bM: \mathbf{M}
        \bN: \mathbf{N}
        \bO: \mathbf{O}
        \bP: \mathbf{P}
        \bQ: \mathbf{Q}
        \bR: \mathbf{R}
        \bS: \mathbf{S}
        \bT: \mathbf{T}
        \bU: \mathbf{U}
        \bV: \mathbf{V}
        \bW: \mathbf{W}
        \bX: \mathbf{X}
        \bY: \mathbf{Y}
        \bZ: \mathbf{Z}
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: false
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
  - source: github:quartz-community/recent-notes
    enabled: true
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source:
      name: quartz-themes
      repo: github:saberzero1/quartz-themes
      subdir: plugin
    enabled: false
    options:
      theme: default
  - source: github:pink10000/created-modified-date
    enabled: true
    options:
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:pink10000/desmos-render
    enabled: true
    options: {}
    order: 80
  - source: github:pink10000/tikz-render
    enabled: true
    options: {}
    order: 80
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
